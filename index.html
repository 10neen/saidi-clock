<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الصعيدي للأدوات الصحية</title>
    
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="logo.jpg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffb74d">

    <meta property="og:title" content="معرض الصعيدي للأدوات الصحية">
    <meta property="og:description" content="الساعة والتواريخ، حاسبة الأسعار، وطلب أقرب سباك - مسجد الرحمن، بشتيل، إمبابة">
    <meta property="og:image" content="logo.jpg">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <div class="screen active">
            <header class="app-header">
                <h1>معرض الصعيدي</h1>
                <p>مسجد الرحمن - بشتيل - إمبابة</p>
            </header>

            <main class="clock-section">
                <!-- الإطار البرونزي النحاسي للساعة -->
                <div class="watch-case-bezel">
                    <div class="clock-face" id="clockFace">
                        <div class="sapphire-glass-dome"></div>
                        <div class="glass-shine-streak"></div>
                        
                        <div class="ticks-container" id="ticksContainer"></div>

                        <span class="num n12">١٢</span>
                        <span class="num n1">١</span>
                        <span class="num n2">٢</span>
                        <span class="num n3">٣</span>
                        <span class="num n4">٤</span>
                        <span class="num n5">٥</span>
                        <span class="num n6">٦</span>
                        <span class="num n7">٧</span>
                        <span class="num n8">٨</span>
                        <span class="num n9">٩</span>
                        <span class="num n10">١٠</span>
                        <span class="num n11">١١</span>

                        <div class="clock-logo">الصعيدي</div>

                        <div class="hand hour" id="hourHand"></div>
                        <div class="hand minute" id="minuteHand"></div>
                        <div class="hand second" id="secondHand"></div>
                        <div class="center-dot"></div>
                    </div>
                </div>

                <!-- شريط التواريخ الثلاثة المدمج -->
                <div class="triple-date-bar glass-panel">
                    <div id="hijriDateDisplay" class="date-row">هجري: جاري التحميل...</div>
                    <div id="miladiDateDisplay" class="date-row miladi-sub">ميلادي: جاري التحميل...</div>
                    <div id="copticDateDisplay" class="date-row coptic-sub">قبطي: جاري التحميل...</div>
                </div>
            </main>

            <!-- تخطيط الأزرار الجديد: الزرارين الصغار فوق والفيسبوك تحت -->
            <div class="action-buttons-layout">
                <!-- الزرارين الصغيرين في صف واحد فوق -->
                <div class="button-row">
                    <a href="https://10neen.github.io/saadi-prices/" target="_blank" class="nav-btn-link glass-btn">
                        <span class="icon">🧮</span> اعرف اسعار النهارده
                    </a>
                    <a href="https://10neen.github.io/grob_els3ydy/" target="_blank" class="plumber-btn-grid glass-btn-accent">
                        <span class="icon">🛠️</span> اتصل بأقرب سباك
                    </a>
                </div>

                <!-- زر الفيسبوك الكبير تحت خالص -->
                <a href="https://web.facebook.com/als3ydy" target="_blank" class="nav-btn glass-btn full-width-btn fb-btn">
                    <span class="icon">📘</span> زور صفحتنا على فيسبوك
                </a>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
